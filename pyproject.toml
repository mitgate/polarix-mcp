[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polarix-mcp"
version = "0.1.0"
description = "Browser automation MCP server — Map First architecture for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "browser", "automation", "playwright", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "playwright>=1.40.0",
    "browser-use>=0.1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
all = ["openai>=1.0.0", "anthropic>=0.25.0"]

[project.urls]
Homepage = "https://github.com/mitgate/polarix-mcp"
Repository = "https://github.com/mitgate/polarix-mcp"
Issues = "https://github.com/mitgate/polarix-mcp/issues"

[project.scripts]
polarix-mcp = "polaris.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["polaris"]
