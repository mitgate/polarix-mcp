[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polarix-mcp"
version = "1.1.0"
description = "Browser and desktop automation MCP server — Map First architecture for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "mcp", "browser", "desktop", "automation", "playwright", "pywinauto",
    "testing", "vm", "ai", "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "playwright>=1.40.0",
    "browser-use>=0.1.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
# Guest-side agent (runs inside the Windows VM; no Playwright or MCP needed there)
desktop-agent = ["pywinauto>=0.6.8", "pynput>=1.7", "pillow>=10.0"]
all = ["openai>=1.0.0", "anthropic>=0.25.0", "pywinauto>=0.6.8", "pynput>=1.7"]

[project.urls]
Homepage = "https://github.com/mitgate/polarix-mcp"
Repository = "https://github.com/mitgate/polarix-mcp"
Issues = "https://github.com/mitgate/polarix-mcp/issues"

[project.scripts]
polarix-mcp = "polarix.__main__:main"
polarix-agent = "polarix.desktop.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["polarix"]
